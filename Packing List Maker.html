<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packing List Maker</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--ac:#16a34a;--bd:#d4d4d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#eee;--card:#222427;--bd:#3a3d41}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#eee;--card:#222427;--bd:#3a3d41}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5}
.wrap{padding:12px;overflow-x:auto}
.hint{padding:0 12px;font-size:13px;opacity:.7}
#sheet{width:760px;margin:0 auto;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;padding:0}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
#sheet td,#sheet th{border:1px solid #000;padding:2px 3px;text-align:center;font-size:12px;font-weight:700;vertical-align:middle}
#sheet input{width:100%;box-sizing:border-box;border:0;background:transparent;color:#000;font:inherit;text-align:center;padding:3px 0;outline:none;border-radius:0}
#sheet input:focus{background:#fff8c5}
.title input{font-size:22px;font-weight:400;padding:4px 0}
.cons{width:28px}
.rm{border:0!important;width:26px;padding:0!important}
.rm button{padding:0 6px;font-size:14px;color:#b00;border:0;background:none}
.noprint{}
@media print{.bar,.hint,.noprint{display:none!important}body{background:#fff}.wrap{padding:0;overflow:visible}#sheet{margin:0}#sheet input:focus{background:none}}
.cap #sheet input:focus{background:none}
.cap .noprint{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:8;overflow:auto;padding:16px;text-align:center;color:#fff}
#ov img{max-width:100%;background:#fff}
</style></head><body>
<div class="bar">
  <button class="p" id="bShare">Share on WhatsApp</button>
  <button id="bSave">Save as image</button>
  <button id="bPrint">Print</button>
  <button id="bNew">Clear</button>
</div>
<p class="hint">Tap any field on the sheet to edit it. Use “+ Add customer” for more rows.</p>
<div class="wrap"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="ov"><p>Press and hold the image to save it, then close.</p><img id="ovi" alt=""><p><button id="ovc">Close</button></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var KEY='packlist_v1';
var DEF={company:'TSD GLOBAL EXPRESS',addr:'GUANG ZHOU CITY.GUANG DONG PROVINCE. CHINA',office:'Office:86-02033972130',mob:'Mob:86-18664647344/17877330972',
consignee:'ETS SALIYOUN',contact:'CONTACT NO.:611669593/621111500',plno:'PLNO:SAS076 (40 PIEDS)',mark:'SHIP MARK: MAERSK',
load:'13/07/2026',ship:'20/07/2026',arr:'09/10/2026',dest:'GUINEE CONAKRY',container:'MRKU4720595',
rows:[{name:'FATOUMATA BINTA LY',bill:'3634#',desc:'MIX',qty:'12 CTN',cbm:'2.81',usd:'983.50'}]};
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!S||!S.rows)S=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function f(k,extra){return '<input data-k="'+k+'" value="'+esc(S[k])+'"'+(extra||'')+'>'}
function r(i,k){return '<input data-r="'+i+'" data-k="'+k+'" value="'+esc(S.rows[i][k])+'">'}
function num(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function fmt(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
  var h='<table><colgroup><col style="width:5%"><col style="width:20%"><col style="width:12%"><col style="width:14%"><col style="width:10%"><col style="width:8%"><col style="width:15%"><col style="width:16%"></colgroup>';
  h+='<tr class="title"><td colspan="8">'+f('company')+'</td></tr>';
  h+='<tr><td colspan="8">'+f('addr')+'</td></tr>';
  h+='<tr><td colspan="4">'+f('office')+'</td><td colspan="4">'+f('mob')+'</td></tr>';
  h+='<tr><td class="cons" rowspan="3" style="font-size:11px">CONS<br>I<br>GNEE<br>:</td><td colspan="3">'+f('consignee')+'</td><td colspan="3">'+f('plno')+'</td><td>'+f('mark')+'</td></tr>';
  h+='<tr><td colspan="3">'+f('contact')+'</td><td colspan="2">LOADING DATE:<br>'+f('load')+'</td><td>SHIPING DATE:<br>'+f('ship')+'</td><td>ARRIVAL TIME DATE.:<br>'+f('arr')+'</td></tr>';
  h+='<tr><td colspan="3">'+f('dest')+'</td><td colspan="4">PACKING LIST</td></tr>';
  h+='<tr><td>NO.</td><td>CUSTOMER<br>NAME &amp; TEL NO.</td><td>CARGO BILL</td><td>DESCRIPTIONS</td><td>QTY</td><td>CBM</td><td>TOTAL CBM</td><td>TOTAL USD RENDU</td></tr>';
  var tc=0,tu=0;
  S.rows.forEach(function(x,i){
    tc+=num(x.cbm);tu+=num(x.usd);
    h+='<tr><td>'+(i+1)+'</td><td>'+r(i,'name')+'</td><td>'+r(i,'bill')+'</td><td>'+r(i,'desc')+'</td><td>'+r(i,'qty')+'</td><td>'+r(i,'cbm')+'</td><td>'+esc(x.cbm)+'</td><td style="text-align:left">$ <span style="float:right;padding-right:6px">'+r(i,'usd')+'</span></td>';
    if(S.rows.length>1)h+='<td class="rm noprint"><button data-del="'+i+'">✕</button></td>';
    h+='</tr>';
  });
  if(S.rows.length>1){
    h+='<tr><td colspan="5" style="text-align:right">TOTAL</td><td></td><td>'+fmt(tc)+'</td><td>$ '+fmt(tu)+'</td></tr>';
  }
  h+='<tr><td colspan="8">CONTAINER No: '+f('container','style="width:60%"')+'</td></tr></table>';
  h+='<div class="noprint" style="padding:8px;text-align:center"><button id="bAdd" style="color:#000">+ Add customer</button></div>';
  document.getElementById('sheet').innerHTML=h;
}
render();
var sh=document.getElementById('sheet');
sh.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.k;if(!k)return;
  if(t.dataset.r!==undefined)S.rows[+t.dataset.r][k]=t.value;else S[k]=t.value;
  save();
});
sh.addEventListener('change',function(e){if(e.target.dataset.r!==undefined&&(e.target.dataset.k==='cbm'||e.target.dataset.k==='usd'))render()});
sh.addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='bAdd'){S.rows.push({name:'',bill:'',desc:'MIX',qty:'',cbm:'',usd:''});save();render()}
  if(t.dataset.del!==undefined){S.rows.splice(+t.dataset.del,1);save();render()}
});
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3500)}
function capture(){
  document.activeElement&&document.activeElement.blur();
  document.body.classList.add('cap');
  return html2canvas(sh,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(c){
    document.body.classList.remove('cap');
    return new Promise(function(res){c.toBlob(res,'image/png')});
  },function(e){document.body.classList.remove('cap');throw e});
}
function fname(){var n=(S.rows[0]&&S.rows[0].name||'packing-list').replace(/[^\w\-]+/g,'_');return 'packing-list-'+n+'.png'}
function showImg(blob){document.getElementById('ovi').src=URL.createObjectURL(blob);document.getElementById('ov').style.display='block'}
function saveBlob(blob){
  return (window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(function(d){
    if(!d){showImg(blob);return}
    return d.save({filename:fname(),data:blob}).then(function(){toast('Image saved')},function(e){if(e&&e.code==='declined')return;showImg(blob)});
  });
}
document.getElementById('ovc').onclick=function(){document.getElementById('ov').style.display='none'};
document.getElementById('bSave').onclick=function(){
  if(typeof html2canvas==='undefined'){toast('Image tool not loaded');return}
  toast('Preparing image…');capture().then(saveBlob).catch(function(){toast('Could not create image')});
};
function summary(){
  var l=[S.company,'Container: '+S.container,'To: '+S.dest,'Arrival: '+S.arr,''];
  S.rows.forEach(function(x){l.push(x.name+' | Bill '+x.bill+' | '+x.qty+' | '+x.cbm+' CBM | $'+x.usd)});
  return l.join('\n');
}
document.getElementById('bShare').onclick=function(){
  if(typeof html2canvas==='undefined'){toast('Image tool not loaded');return}
  toast('Preparing image…');
  capture().then(function(blob){
    var file=new File([blob],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],text:summary()}).catch(function(e){if(e&&e.name!=='AbortError')throw e});
    }
    // fallback: save image, then open WhatsApp with text so the image can be attached
    return saveBlob(blob).then(function(){
      window.open('https://wa.me/?text='+encodeURIComponent(summary()),'_blank');
      toast('Attach the saved image in WhatsApp');
    });
  }).catch(function(){toast('Could not share')});
};
document.getElementById('bPrint').onclick=function(){
  try{window.print()}catch(e){toast('Printing is blocked here — use Save as image, then print it')}
};
document.getElementById('bNew').onclick=function(){
  if(!confirm('Clear all data and start a blank sheet?'))return;
  S=JSON.parse(JSON.stringify(DEF));
  Object.keys(S).forEach(function(k){if(typeof S[k]==='string')S[k]=''});
  S.company=DEF.company;S.addr=DEF.addr;S.office=DEF.office;S.mob=DEF.mob;
  S.rows=[{name:'',bill:'',desc:'MIX',qty:'',cbm:'',usd:''}];
  save();render();
};
</script>
</body></html>
